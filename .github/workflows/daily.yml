name: Günlük video

on:
  schedule:
    # GitHub sadece UTC bilir: iki saatte tetiklenir, script Berlin saatine bakıp
    # yalnızca ~11:50'deki çalışmayı kullanır → video yaz/kış saatinde de ~12:00'de gelir.
    - cron: "50 9 * * *"
    - cron: "50 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bugün video gönderilmiş olsa bile yeni video gönder"
        type: boolean
        default: false
  repository_dispatch:
    types: [daily]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # video sonrası onayı 5,5 saate kadar bekler (public repoda dakika ücretsiz)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Python paketleri
        run: pip install -r requirements.txt

      - name: Ses modeli (önbellek)
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: .piper
          key: piper-tr-fahrettin-medium-v1

      - name: Ses modelini indir
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .piper && cd .piper
          curl -sSL -o v.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-tr_TR-fahrettin-medium.tar.bz2
          tar xjf v.tar.bz2 --strip-components=1 --wildcards '*/tr_TR-fahrettin-medium.onnx' '*/tr_TR-fahrettin-medium.onnx.json'
          rm v.tar.bz2 && ls -la

      - name: Videoyu üret ve Telegram'a gönder
        env:
          TZ: Europe/Berlin
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force || github.event.client_payload.force || 'false' }}
          PIPER_MODEL: ${{ github.workspace }}/.piper/tr_TR-fahrettin-medium.onnx
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PHOTO_RATIO: ${{ vars.PHOTO_RATIO || '0.5' }}
        run: python -m src.daily

      - name: Durumu kaydet (video gönderildi)
        run: |
          git config user.name "hergunyenibirbilgi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "durum: günlük video $(date +%F)" && git pull --rebase && git push)

      - name: Onayı bekle ve paylaş
        env:
          WAIT_SECONDS: "19800"   # 5,5 saat; butona basıldığı anda paylaşır ve biter
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v25.0' }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
          IG_UPLOAD_MODE: ${{ vars.IG_UPLOAD_MODE || 'auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.approve

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "hergunyenibirbilgi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "durum: onay $(date +%F)" && git pull --rebase && git push)
