name: Onay kontrolü

on:
  schedule:
    - cron: "25 11-21 * * *"   # her saat 12:25–22:25 arası (yaz saatinde 13:25–23:25)
  workflow_dispatch: {}        # Telegram'da onayladıktan sonra beklemek istemezsen elle çalıştır

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketler
        run: pip install requests

      - name: Telegram onaylarını işle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v25.0' }}
          IG_LOGIN: ${{ vars.IG_LOGIN || 'instagram' }}
          IG_UPLOAD_MODE: ${{ vars.IG_UPLOAD_MODE || 'auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # geçici video linki (media branch) için
        run: python -m src.approve

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "hergunyenibirbilgi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "durum: onay kontrolü" && git pull --rebase && git push)
